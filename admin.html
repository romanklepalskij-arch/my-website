<!DOCTYPE html>
<html>
<head>
    <title>Admin Map View</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrDd-k9CWVlFq6YU7Nba1J-Xx3rd4opuw",
            authDomain: "my-tracker-map-15db4.firebaseapp.com",
            projectId: "my-tracker-map-15db4",
            storageBucket: "my-tracker-map-15db4.firebasestorage.app",
            messagingSenderId: "485255429808",
            appId: "1:485255429808:web:15741013d3cdf6efacc575",
            databaseURL: "https://my-tracker-map-15db4-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Initialize the map focused on Norway/Europe
        const map = L.map('map').setView([59.91, 10.75], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        const markers = {};

        // Listen for data in real-time
        database.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            for (let name in data) {
                const user = data[name];
                if (markers[name]) {
                    // Update existing marker
                    markers[name].setLatLng([user.lat, user.lng]);
                } else {
                    // Create new marker
                    markers[name] = L.marker([user.lat, user.lng]).addTo(map)
                        .bindPopup(`<b>${name}</b><br>Battery: ${user.battery}<br>Last seen: ${user.timestamp}`);
                }
            }
        });
    </script>
</body>
</html>
