<!DOCTYPE html>
<html>
<head>
    <title>SnapMap Quest</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Avenir:wght@600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #101010; font-family: 'Avenir', 'Poppins', sans-serif; }
        #map { height: 100vh; width: 100vw; }

        /* Snap Style Header */
        .snap-header {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
        }

        .snap-title {
            background: #FFFC00; /* Snap Yellow */
            color: #000;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
        }

        /* Snap Style Search/Action Bar at bottom */
        .snap-footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 1000;
        }

        .snap-btn {
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            font-size: 20px;
        }

        .snap-btn.main {
            width: 70px;
            height: 70px;
            background: #FFFC00;
            border: 4px solid #000;
        }

        /* Marker Styles */
        .user-dot {
            background: #fff;
            border: 3px solid #000;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255,252,0,0.6);
        }

        .leaflet-container { background: #101010 !important; }
    </style>
</head>
<body>

    <div class="snap-header">
        <div class="snap-title">SnapMap: Lillehammer</div>
    </div>

    <div id="map"></div>

    <div class="snap-footer">
        <div class="snap-btn">🔍</div>
        <div class="snap-btn main">👻</div>
        <div class="snap-btn">📍</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrDd-k9CWVlFq6YU7Nba1J-Xx3rd4opuw",
            authDomain: "my-tracker-map-15db4.firebaseapp.com",
            projectId: "my-tracker-map-15db4",
            storageBucket: "my-tracker-map-15db4.firebasestorage.app",
            messagingSenderId: "485255429808",
            appId: "1:485255429808:web:15741013d3cdf6efacc575",
            databaseURL: "https://my-tracker-map-15db4-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Snap Map Style (Carto Voyager labels on Dark)
        const map = L.map('map', { zoomControl: false }).setView([61.115, 10.466], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
            variant: 'dark_all'
        }).addTo(map);

        const questPoints = [
            { id: 1, name: "Skysstasjonen", lat: 61.1147, lng: 10.4633 },
            { id: 2, name: "Sigrid Undsets Plass", lat: 61.1153, lng: 10.4674 },
            { id: 3, name: "Søndre Park", lat: 61.1125, lng: 10.4685 },
            { id: 4, name: "Storgata Sentrum", lat: 61.1143, lng: 10.4658 },
            { id: 5, name: "Maihaugen Entrance", lat: 61.1121, lng: 10.4775 }
        ];

        const pointMarkers = {};
        const userMarkers = {};

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Create Small Blue Points
        questPoints.forEach(p => {
            pointMarkers[p.id] = L.circle([p.lat, p.lng], {
                color: '#33ccff',
                fillColor: '#33ccff',
                fillOpacity: 0.2,
                weight: 2,
                radius: 20 // Tiny and sleek
            }).addTo(map).bindPopup(p.name);
        });

        database.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            
            // Reset to Snap Blue
            questPoints.forEach(p => {
                pointMarkers[p.id].setStyle({ color: '#33ccff', fillColor: '#33ccff' });
            });

            for (let name in data) {
                const user = data[name];

                if (userMarkers[name]) {
                    userMarkers[name].setLatLng([user.lat, user.lng]);
                } else {
                    // Marker for users looks like a Snap avatar dot
                    userMarkers[name] = L.circleMarker([user.lat, user.lng], {
                        radius: 8,
                        fillColor: "#fff",
                        color: "#000",
                        weight: 3,
                        fillOpacity: 1
                    }).addTo(map).bindPopup(`<b>${name}</b>`);
                }

                questPoints.forEach(p => {
                    const distance = getDistance(user.lat, user.lng, p.lat, p.lng);
                    if (distance < 50) { 
                        pointMarkers[p.id].setStyle({ 
                            color: '#ff0033', // Snap Alert Red
                            fillColor: '#ff0033',
                            fillOpacity: 0.6
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
