<!DOCTYPE html>
<html>
<head>
    <title>Lillehammer Quest - 5 Points</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrDd-k9CWVlFq6YU7Nba1J-Xx3rd4opuw",
            authDomain: "my-tracker-map-15db4.firebaseapp.com",
            projectId: "my-tracker-map-15db4",
            storageBucket: "my-tracker-map-15db4.firebasestorage.app",
            messagingSenderId: "485255429808",
            appId: "1:485255429808:web:15741013d3cdf6efacc575",
            databaseURL: "https://my-tracker-map-15db4-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const map = L.map('map').setView([61.115, 10.466], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // 1. Definer 5 punkter i Lillehammer
        const questPoints = [
            { id: 1, name: "Skysstasjonen", lat: 61.1147, lng: 10.4633 },
            { id: 2, name: "Sigrid Undsets Plass", lat: 61.1153, lng: 10.4674 },
            { id: 3, name: "Søndre Park", lat: 61.1125, lng: 10.4685 },
            { id: 4, name: "Storgata Sentrum", lat: 61.1143, lng: 10.4658 },
            { id: 5, name: "Maihaugen Entrance", lat: 61.1121, lng: 10.4775 }
        ];

        const pointMarkers = {};
        const userMarkers = {};

        // Funksjon for å regne ut avstand i meter
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Tegn alle punkter som BLÅ med en gang
        questPoints.forEach(p => {
            pointMarkers[p.id] = L.circle([p.lat, p.lng], {
                color: 'blue',
                fillColor: '#30f',
                fillOpacity: 0.4,
                radius: 50 // Sone på 50 meter
            }).addTo(map).bindPopup(p.name);
        });

        // 2. Lytt på endringer i Firebase
        database.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            
            // Nullstill farger til blå før vi sjekker avstand på nytt
            questPoints.forEach(p => {
                pointMarkers[p.id].setStyle({ color: 'blue', fillColor: '#30f' });
            });

            for (let name in data) {
                const user = data[name];

                // Oppdater eller lag markør for personene
                if (userMarkers[name]) {
                    userMarkers[name].setLatLng([user.lat, user.lng]);
                } else {
                    userMarkers[name] = L.marker([user.lat, user.lng]).addTo(map).bindPopup(name);
                }

                // Sjekk om denne personen er nær noen av de 5 punktene
                questPoints.forEach(p => {
                    const distance = getDistance(user.lat, user.lng, p.lat, p.lng);
                    if (distance < 50) { 
                        // Skift farge til RØD hvis noen er nærmere enn 50m
                        pointMarkers[p.id].setStyle({ color: 'red', fillColor: '#f03' });
                    }
                });
            }
        });
    </script>
</body>
</html>
