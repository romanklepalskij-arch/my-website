<!DOCTYPE html>
<html>
<head>
    <title>Lillehammer Quest | Premium Edition</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; background: #0b0e14; overflow: hidden; }
        #map { height: 100vh; width: 100vw; background: #0b0e14; }
        
        /* Glassmorphism Header */
        .overlay-header {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            border-radius: 20px;
            color: #fff;
            border: 1px solid rgba(255, 252, 0, 0.3);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 4px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .overlay-header span { color: #FFFC00; text-shadow: 0 0 10px rgba(255, 252, 0, 0.5); }

        /* Custom Popup Styling */
        .leaflet-popup-content-wrapper {
            background: rgba(20, 20, 20, 0.9) !important;
            color: #fff !important;
            border: 1px solid #444;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
        }
        .leaflet-popup-tip { background: rgba(20, 20, 20, 0.9) !important; }

        /* Hide Default Leaflet Elements */
        .leaflet-control-attribution { background: none !important; color: #444 !important; }
    </style>
</head>
<body>

    <div class="overlay-header">LILLEHAMMER <span>QUEST</span></div>
    <div id="map"></div>

    <script>
        // Your Firebase Configuration (Keep this private)
        const firebaseConfig = {
            apiKey: "AIzaSyCrDd-k9CWVlFq6YU7Nba1J-Xx3rd4opuw",
            authDomain: "my-tracker-map-15db4.firebaseapp.com",
            projectId: "my-tracker-map-15db4",
            storageBucket: "my-tracker-map-15db4.firebasestorage.app",
            messagingSenderId: "485255429808",
            appId: "1:485255429808:web:15741013d3cdf6efacc575",
            databaseURL: "https://my-tracker-map-15db4-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Initialize Map with "Dark Matter" theme
        const map = L.map('map', { zoomControl: false }).setView([61.115, 10.466], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        // Five locations - Radius reduced to 25m for a cleaner look
        const questPoints = [
            { id: 1, name: "Skysstasjonen", lat: 61.1147, lng: 10.4633 },
            { id: 2, name: "Sigrid Undsets Plass", lat: 61.1153, lng: 10.4674 },
            { id: 3, name: "Søndre Park", lat: 61.1125, lng: 10.4685 },
            { id: 4, name: "Storgata Sentrum", lat: 61.1143, lng: 10.4658 },
            { id: 5, name: "Maihaugen Entrance", lat: 61.1121, lng: 10.4775 }
        ];

        const pointMarkers = {};
        const userMarkers = {};

        // Haversine Distance Formula
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Draw initial Glow Points (Cyan)
        questPoints.forEach(p => {
            pointMarkers[p.id] = L.circle([p.lat, p.lng], {
                color: '#00fbff',
                fillColor: '#00fbff',
                fillOpacity: 0.15,
                weight: 3,
                dashArray: '5, 10', // Animated look
                radius: 25
            }).addTo(map).bindPopup(`<b>${p.name}</b>`);
        });

        database.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            
            // Reset colors
            questPoints.forEach(p => {
                pointMarkers[p.id].setStyle({ color: '#00fbff', fillColor: '#00fbff' });
            });

            for (let name in data) {
                const user = data[name];

                // Update or create User Pulse Marker
                if (userMarkers[name]) {
                    userMarkers[name].setLatLng([user.lat, user.lng]);
                } else {
                    userMarkers[name] = L.circleMarker([user.lat, user.lng], {
                        radius: 6,
                        fillColor: "#fff",
                        color: "#FFFC00", // Snapchat yellow border for player
                        weight: 4,
                        fillOpacity: 1
                    }).addTo(map).bindPopup(`<b>Player: ${name}</b>`);
                }

                // Logic: Blue to Red within 50m
                questPoints.forEach(p => {
                    const distance = getDistance(user.lat, user.lng, p.lat, p.lng);
                    if (distance < 50) { 
                        pointMarkers[p.id].setStyle({ 
                            color: '#ff2d55', 
                            fillColor: '#ff2d55',
                            fillOpacity: 0.5,
                            dashArray: '0' 
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
