<!DOCTYPE html>
<html>
<head>
    <title>SnapMap</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Avenir:wght@600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Avenir', 'Poppins', sans-serif; background: #f4f4f4; }
        #map { height: 100vh; width: 100vw; }

        /* Overskrift - Nå bare "SnapMap" */
        .snap-header {
            position: absolute;
            top: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1000;
            pointer-events: none; /* Lar deg trykke gjennom overskriften for å styre kartet */
        }

        .snap-title {
            background: #FFFC00; /* Snap Yellow */
            color: #000;
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            pointer-events: auto;
        }

        /* Snap-knapper nederst */
        .snap-footer {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            z-index: 1000;
            pointer-events: none;
        }

        .snap-btn {
            background: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            font-size: 20px;
            pointer-events: auto;
            cursor: pointer;
        }

        .snap-btn.main {
            width: 70px;
            height: 70px;
            background: #FFFC00;
            border: 3px solid #000;
        }
    </style>
</head>
<body>

    <div class="snap-header">
        <div class="snap-title">SnapMap</div>
    </div>

    <div id="map"></div>

    <div class="snap-footer">
        <div class="snap-btn">💬</div>
        <div class="snap-btn main" onclick="map.setView([61.115, 10.466], 14)">👻</div>
        <div class="snap-btn">📍</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrDd-k9CWVlFq6YU7Nba1J-Xx3rd4opuw",
            authDomain: "my-tracker-map-15db4.firebaseapp.com",
            projectId: "my-tracker-map-15db4",
            storageBucket: "my-tracker-map-15db4.firebasestorage.app",
            messagingSenderId: "485255429808",
            appId: "1:485255429808:web:15741013d3cdf6efacc575",
            databaseURL: "https://my-tracker-map-15db4-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // 1. Fikset Kartet: Nå er det lyst, fargerikt og du kan zoome fritt!
        const map = L.map('map').setView([61.115, 10.466], 14);
        
        // Et moderne, lyst kart-design som ligner Snap Map
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap',
            maxZoom: 19
        }).addTo(map);

        // Dine 5 steder
        const questPoints = [
            { id: 1, name: "Skysstasjonen", lat: 61.1147, lng: 10.4633 },
            { id: 2, name: "Sigrid Undsets Plass", lat: 61.1153, lng: 10.4674 },
            { id: 3, name: "Søndre Park", lat: 61.1125, lng: 10.4685 },
            { id: 4, name: "Storgata Sentrum", lat: 61.1143, lng: 10.4658 },
            { id: 5, name: "Maihaugen Entrance", lat: 61.1121, lng: 10.4775 }
        ];

        const pointMarkers = {};
        const userMarkers = {};

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // Tegn de blå sonene (Nå synes de bedre på det lyse kartet)
        questPoints.forEach(p => {
            pointMarkers[p.id] = L.circle([p.lat, p.lng], {
                color: '#0084ff',
                fillColor: '#0084ff',
                fillOpacity: 0.3,
                weight: 2,
                radius: 30
            }).addTo(map).bindPopup(p.name);
        });

        database.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            
            // Nullstill til blått
            questPoints.forEach(p => {
                pointMarkers[p.id].setStyle({ color: '#0084ff', fillColor: '#0084ff' });
            });

            for (let name in data) {
                const user = data[name];

                // Brukerens markør
                if (userMarkers[name]) {
                    userMarkers[name].setLatLng([user.lat, user.lng]);
                } else {
                    userMarkers[name] = L.circleMarker([user.lat, user.lng], {
                        radius: 8,
                        fillColor: "#FFFC00", // Snap Yellow senter
                        color: "#000",        // Svart kant
                        weight: 3,
                        fillOpacity: 1
                    }).addTo(map).bindPopup(`<b>${name}</b><br>Batteri: ${user.battery}`);
                }

                // Sjekk avstand - bytt til RØD hvis under 50m
                questPoints.forEach(p => {
                    const distance = getDistance(user.lat, user.lng, p.lat, p.lng);
                    if (distance < 50) { 
                        pointMarkers[p.id].setStyle({ 
                            color: '#ff0033', 
                            fillColor: '#ff0033',
                            fillOpacity: 0.5
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
