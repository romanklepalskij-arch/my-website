<!DOCTYPE html>
<html>
<head>
    <title>Lillehammer Quest | Admin Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: #1a1a1a; }
        #map { height: 100vh; width: 100vw; }
        
        /* Custom Styling for Popups */
        .leaflet-popup-content-wrapper {
            background: #2c2c2c;
            color: #fff;
            border-radius: 12px;
            padding: 5px;
        }
        .leaflet-popup-tip { background: #2c2c2c; }
        
        /* Header Overlay */
        .overlay-header {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px;
            border-radius: 50px;
            color: #FFFC00; /* Snapchat Yellow */
            border: 2px solid #FFFC00;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="overlay-header">LILLEHAMMER QUEST</div>
    <div id="map"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCrDd-k9CWVlFq6YU7Nba1J-Xx3rd4opuw",
            authDomain: "my-tracker-map-15db4.firebaseapp.com",
            projectId: "my-tracker-map-15db4",
            storageBucket: "my-tracker-map-15db4.firebasestorage.app",
            messagingSenderId: "485255429808",
            appId: "1:485255429808:web:15741013d3cdf6efacc575",
            databaseURL: "https://my-tracker-map-15db4-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Initialiser kartet med et mørkt, vakkert tema
        const map = L.map('map', { zoomControl: false }).setView([61.115, 10.466], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // Flytt zoom-knappen til bunnen
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 5 Punkter - Gjort sirkelen litt mindre (radius 35m)
        const questPoints = [
            { id: 1, name: "Skysstasjonen", lat: 61.1147, lng: 10.4633 },
            { id: 2, name: "Sigrid Undsets Plass", lat: 61.1153, lng: 10.4674 },
            { id: 3, name: "Søndre Park", lat: 61.1125, lng: 10.4685 },
            { id: 4, name: "Storgata Sentrum", lat: 61.1143, lng: 10.4658 },
            { id: 5, name: "Maihaugen Entrance", lat: 61.1121, lng: 10.4775 }
        ];

        const pointMarkers = {};
        const userMarkers = {};

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Tegn punktene som pene blå "neon" sirkler
        questPoints.forEach(p => {
            pointMarkers[p.id] = L.circle([p.lat, p.lng], {
                color: '#00d4ff',      // Neon Blue
                fillColor: '#00d4ff',
                fillOpacity: 0.3,
                weight: 2,
                radius: 35             // Mindre radius som du ba om
            }).addTo(map).bindPopup(`<b>${p.name}</b>`);
        });

        database.ref('locations').on('value', (snapshot) => {
            const data = snapshot.val();
            
            // Reset alle til blått før sjekk
            questPoints.forEach(p => {
                pointMarkers[p.id].setStyle({ color: '#00d4ff', fillColor: '#00d4ff' });
            });

            for (let name in data) {
                const user = data[name];

                if (userMarkers[name]) {
                    userMarkers[name].setLatLng([user.lat, user.lng]);
                } else {
                    // Lag en stilig hvit sirkel-markør for brukeren
                    userMarkers[name] = L.circleMarker([user.lat, user.lng], {
                        radius: 8,
                        fillColor: "#fff",
                        color: "#000",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 1
                    }).addTo(map).bindPopup(`<b>${name}</b>`);
                }

                questPoints.forEach(p => {
                    const distance = getDistance(user.lat, user.lng, p.lat, p.lng);
                    if (distance < 50) { 
                        // Skift til rød "neon" når noen er nær
                        pointMarkers[p.id].setStyle({ color: '#ff4b2b', fillColor: '#ff4b2b' });
                    }
                });
            }
        });
    </script>
</body>
</html>
