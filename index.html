<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Dimension</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        overflow: hidden;
        background: #050816;
        color: white;
        height: 100vh;
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at center,
          rgba(0, 255, 255, 0.05),
          transparent 60%
        );
        pointer-events: none;
      }

      .container {
        position: relative;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      h1 {
        font-size: 6rem;
        text-transform: uppercase;
        letter-spacing: 10px;
        background: linear-gradient(90deg, #00f0ff, #ff00ea, #00f0ff);
        background-size: 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientMove 5s infinite linear;
        text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
      }

      p {
        margin-top: 20px;
        font-size: 1.3rem;
        max-width: 700px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.8);
      }

      .buttons {
        margin-top: 40px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        padding: 15px 35px;
        border: none;
        border-radius: 50px;
        background: rgba(255, 255, 255, 0.05);
        color: white;
        font-size: 1rem;
        cursor: pointer;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        transition: 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      button::before {
        content: "";
        position: absolute;
        top: -100%;
        left: -100%;
        width: 300%;
        height: 300%;
        background: linear-gradient(
          45deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transform: rotate(45deg);
        transition: 0.5s;
      }

      button:hover::before {
        top: 100%;
        left: 100%;
      }

      button:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        border-color: #00f0ff;
      }

      .floating-card {
        position: absolute;
        width: 250px;
        height: 160px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 25px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        animation: float 6s ease-in-out infinite;
      }

      .floating-card h3 {
        color: #00f0ff;
        font-size: 1.2rem;
      }

      .floating-card p {
        font-size: 0.9rem;
        margin: 0;
      }

      .card1 {
        top: 10%;
        left: 8%;
      }

      .card2 {
        bottom: 12%;
        right: 10%;
        animation-delay: 2s;
      }

      .card3 {
        top: 18%;
        right: 12%;
        animation-delay: 4s;
      }

        0% {
