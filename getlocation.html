<!doctype html>
<html>
<head>
    <title>SnapMap Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div style="text-align: center; padding-top: 50px; font-family: sans-serif;">
        <h2 style="color: #333;">SnapMap Tracker</h2>
        <p>Enter your name to share your location:</p>
        <input type="text" id="username" placeholder="Your Name" style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; width: 80%; max-width: 300px;"><br><br>
        <button onclick="sendData()" style="padding: 15px 30px; background: #FFFC00; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #e6e300; font-size: 16px;">SHARE LOCATION</button>
        <p id="status" style="margin-top: 20px; font-weight: bold;"></p>
    </div>

    <script>
        // Your Firebase configuration from your screenshot
        const firebaseConfig = {
            apiKey: "AIzaSyCrDd-k9CWVlFq6YU7Nba1J-Xx3rd4opuw",
            authDomain: "my-tracker-map-15db4.firebaseapp.com",
            projectId: "my-tracker-map-15db4",
            storageBucket: "my-tracker-map-15db4.firebasestorage.app",
            messagingSenderId: "485255429808",
            appId: "1:485255429808:web:15741013d3cdf6efacc575",
            databaseURL: "https://my-tracker-map-15db4-default-rtdb.europe-west1.firebasedatabase.app"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function sendData() {
            const name = document.getElementById("username").value.trim() || "Anonymous";
            const status = document.getElementById("status");
            
            status.innerText = "🔍 Locating...";
            status.style.color = "black";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                let battery = "N/A";
                if ("getBattery" in navigator) {
                    const b = await navigator.getBattery();
                    battery = (b.level * 100).toFixed(0) + "%";
                }

                // Send data to Realtime Database
                database.ref('locations/' + name).set({
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    battery: battery,
                    timestamp: new Date().toLocaleString()
                }).then(() => {
                    status.innerText = "✅ Location shared successfully!";
                    status.style.color = "green";
                }).catch((error) => {
                    status.innerText = "❌ Database error: " + error.message;
                    status.style.color = "red";
                });

            }, (err) => {
                status.innerText = "❌ Error: Please allow GPS access!";
                status.style.color = "red";
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
