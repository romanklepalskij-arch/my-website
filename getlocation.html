<!doctype html>
<html>
<head>
    <title>SnapMap Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
</head>
<body>
    <div style="text-align: center; padding-top: 50px; font-family: sans-serif;">
        <h2>SnapMap</h2>
        <input type="text" id="username" placeholder="Твое имя" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc;"><br><br>
        <button onclick="sendData()" style="padding: 15px 30px; background: #FFFC00; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; box-shadow: 0 4px #e6e300;">ОТПРАВИТЬ ПОЗИЦИЮ</button>
        <p id="status" style="margin-top: 20px; color: #666;"></p>
    </div>

    <script>
        // ТВОИ НАСТРОЙКИ ИЗ FIREBASE (ШАГ 1):
        const firebaseConfig = {
            // ВСТАВЬ СЮДА СВОИ КЛЮЧИ (apiKey, authDomain и т.д.)
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        async function sendData() {
            let name = document.getElementById("username").value || "Аноним";
            let status = document.getElementById("status");
            status.innerText = "Определяю локацию...";

            navigator.geolocation.getCurrentPosition(async (pos) => {
                let battery = "N/A";
                if ("getBattery" in navigator) {
                    const b = await navigator.getBattery();
                    battery = (b.level * 100).toFixed(0) + "%";
                }

                // Запись данных в базу
                database.ref('locations/' + name).set({
                    lat: pos.coords.latitude,
                    lng: pos.coords.longitude,
                    battery: battery,
                    time: new Date().toLocaleTimeString()
                });

                status.innerText = "Успешно! Ты на карте.";
                status.style.color = "green";
            }, (err) => {
                status.innerText = "Ошибка: Разреши доступ к GPS в браузере!";
                status.style.color = "red";
            });
        }
    </script>
</body>
</html>
